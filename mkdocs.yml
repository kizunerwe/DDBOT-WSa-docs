# DDBOT-WSa 文档中心配置
# 生成器：MkDocs Material 9.x
# 本地预览：mkdocs serve
# 本地构建：mkdocs build
# 发布：由 .github/workflows/docs.yml 自动推送到 gh-pages

site_name: DDBOT-WSa 文档
site_url: https://kizunerwe.github.io/DDBOT-WSa-docs/
site_description: DDBOT-WSa —— 基于 OneBot 协议的 消息推送框架，支持 B站/斗鱼/虎牙/ACFun/油管/微博/推特/抖音/TwitCasting 订阅推送
site_author: kizunerwe

repo_name: cnxysoft/DDBOT-WSa
repo_url: https://github.com/cnxysoft/DDBOT-WSa

docs_dir: docs
site_dir: site

# 主题
theme:
  name: material
  language: zh
  features:
    - navigation.instant        # 单页应用式导航，切换不刷新
    - navigation.instant.progress
    - navigation.tracking       # URL 随标题变化
    - navigation.tabs           # 顶部一级分类用 Tab
    - navigation.tabs.sticky    # 滚动时 Tab 吸顶
    - navigation.sections       # 侧边栏分组
    - navigation.expand         # 默认展开侧边栏
    - navigation.indexes        # 章节首页
    - navigation.top            # 返回顶部按钮
    - navigation.footer         # 上下页
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索结果高亮
    - search.share              # 搜索结果分享
    - content.code.copy         # 代码块复制按钮
    - content.code.annotate     # 代码注解
    - content.tabs.link         # 内容标签页联动
    - content.tooltips          # 工具提示
    - toc.follow                # 目录跟随
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  favicon: assets/favicon.svg
  icon:
    logo: material/robot
  # 自定义样式
  custom_dir: docs/overrides

# Markdown 扩展
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# 插件
plugins:
  - search:
      lang:
        - ja      # 日语分词器对中文效果较好
        - en
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
      enable_git_follow: false
  - minify:
      minify_html: true

# 额外 CSS/JS
extra_css:
  - assets/stylesheets/extra.css

# 页脚社交链接与版权
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cnxysoft/DDBOT-WSa
      name: 源码仓库（cnxysoft/DDBOT-WSa）
    - icon: fontawesome/brands/github
      link: https://github.com/kizunerwe
      name: 维护者（kizunerwe）
    - icon: fontawesome/brands/bilibili
      link: https://www.bilibili.com/read/cv10602230
      name: B 站专栏介绍
  status:
    new: 新增
    deprecated: 已弃用
    experimental: 实验性

copyright: 由 kizunerwe 维护 · 基于 cnxysoft/DDBOT-WSa

